name: Explicit live source validation
on:
  push:
    branches: ['fix/phase1-stabilization']
    paths: ['.github/workflows/live-source-validation.yml','scripts/live-source-validation.ts','scripts/annual-source-inspection.py','scripts/annual-adapter-validation.ts']
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Read source contracts, preserve evidence, validate adapters without publishing
        run: |
          mkdir -p artifacts
          pnpm school source probe --all --out artifacts/source-probe.json > artifacts/source-probe.log
          pnpm exec tsx scripts/live-source-validation.ts
          python scripts/annual-source-inspection.py
          pnpm exec tsx scripts/annual-adapter-validation.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-source-canary-unpublished
          path: |
            artifacts/source-probe.json
            artifacts/source-probe.log
            artifacts/annual-source-contracts.json
            artifacts/annual-review
            artifacts/live-*
            archive
          retention-days: 7
