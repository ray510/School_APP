name: Eight official school sources production release
on:
  push:
    branches: [release/full-catalog]
    paths: [.github/workflows/official-eight-release.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: hk-school-production
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test
      - run: python -m unittest discover -s tests/official_sources -v
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '10584769105'
          run-id: '35445377360'
          github-token: ${{ github.token }}
          path: reused-base
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '10586098769'
          run-id: '35449352225'
          github-token: ${{ github.token }}
          path: captured-eight
          merge-multiple: true
      - name: Validate all eleven downloaded resources and retain every original row
        run: python -m scripts.official_sources.from_capture --input captured-eight --out artifacts/official-eight
      - name: New application with unchanged original four-source and ten-topic data
        run: |
          pnpm --filter @hk-school/web exec vite build --config vite.production.config.ts
          python scripts/restore-official-base.py
          pnpm exec tsx scripts/build-identity.ts
          node scripts/production-metadata.mjs
          python scripts/full-catalog-verify.py
          python scripts/analytics-verify.py
      - name: Build independently versioned official sources and reconcile raw bytes and shards
        run: |
          python -m scripts.official_sources.pipeline build --input artifacts/official-eight --dist apps/web/dist-production
          python scripts/reproducible-official-package.py
          python -m scripts.official_sources.verify
          node scripts/production-deploy.mjs --config-only
      - name: Actual workerd and desktop mobile browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @hk-school/web exec playwright install --with-deps chromium
          pnpm exec wrangler dev --config artifacts/production/wrangler.production.json --local --port 8795 > artifacts/official-eight/local-worker.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS --max-time 2 http://127.0.0.1:8795/api/v1/health > artifacts/official-eight/local-health.json; then break; fi
            sleep 1
          done
          pnpm --filter @hk-school/web exec playwright test --config playwright.production.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-eight-production-${{ github.run_attempt }}
          path: |
            apps/web/dist-production
            apps/web/test-results-production
            artifacts/official-eight
            artifacts/production
            artifacts/analytics
            artifacts/sitewide
          retention-days: 90
  publish:
    needs: prepare
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: {name: 'official-eight-production-${{ github.run_attempt }}', path: .}
      - name: Archive original data and new official datasets before publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/production-archive.mjs
          node scripts/archive-official-eight.mjs
      - name: Update only schools.finpulsx.win after archive and coverage validation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          SCHOOL_PRODUCTION_DEPLOY: schools.finpulsx.win
        run: node scripts/deploy-official-eight.mjs
      - name: Independent live desktop and mobile acceptance without provider credentials
        env:
          SCHOOL_PRODUCTION_BASE_URL: https://schools.finpulsx.win
          SCHOOL_PRODUCTION_EXPECTED_SHA: ${{ github.sha }}
        run: |
          pnpm --filter @hk-school/web exec playwright install --with-deps chromium
          pnpm --filter @hk-school/web exec playwright test --config playwright.production.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-eight-live-${{ github.run_attempt }}
          path: |
            artifacts/official-eight/deployment-result.json
            artifacts/official-eight/verification.json
            artifacts/official-eight/build-report.json
            artifacts/official-eight/backup-result.json
            artifacts/production/deployment-result.json
            artifacts/production/eight-base-reuse.json
            apps/web/test-results-production
          retention-days: 90
