name: Explicit repository bootstrap
on:
  pull_request:
    paths: ['.github/workflows/repository-bootstrap.yml']
permissions:
  contents: read
jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/phase1-stabilization'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit only the generated lockfile, never force-push or touch main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: commit generated pnpm dependency lockfile'
          git push origin HEAD:refs/heads/fix/phase1-stabilization
  source-contract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explicit read-only S01 observation, separate from unit tests
        run: |
          python - <<'PY'
          import urllib.request, csv, io, hashlib, json, collections, datetime
          url='https://www.edb.gov.hk/attachment/en/student-parents/sch-info/sch-search/sch-location-info/SCH_LOC_EDB.csv'
          req=urllib.request.Request(url,headers={'User-Agent':'HK-School-Guide/0.2 source-contract-check'})
          with urllib.request.urlopen(req,timeout=30) as r:
            raw=r.read(5_000_001)
            if len(raw)>5_000_000: raise ValueError('source exceeds byte budget')
            modified=r.headers.get('Last-Modified')
          text=raw.decode('utf-8-sig',errors='strict')
          if text.lstrip().startswith('<'): raise ValueError('HTML is not a CSV resource')
          reader=csv.DictReader(io.StringIO(text)); rows=list(reader)
          report={'url':url,'fetched_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sha256':hashlib.sha256(raw).hexdigest(),'http_last_modified':modified,'headers':reader.fieldnames,'rows':len(rows),'categories':dict(collections.Counter(r.get('ENGLISH CATEGORY','') for r in rows)),'coordinates_sample':[{k:r.get(k) for k in ('LONGITUDE','LATITUDE')} for r in rows[:3]],'duplicate_school_keys':sum(n>1 for n in collections.Counter(r.get('SCHOOL NO.','') for r in rows).values())}
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
