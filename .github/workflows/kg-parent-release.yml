name: Kindergarten parent-first production release
on:
  push:
    branches: [release/full-catalog]
    paths: [.github/workflows/kg-parent-release.yml, "apps/web/src/full/kg/**", "scripts/kg_parent/**", "scripts/kg-parent*", "tests/kg_parent/**", "tests/unit/kg-parent.test.ts", "apps/web/tests/production/kg-parent.spec.ts"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: hk-school-production
  cancel-in-progress: false
jobs:
  prepare:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test
      - run: python -m unittest discover -s tests/kg_parent -v
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '10587380247'
          run-id: '35450856763'
          github-token: ${{ github.token }}
          path: base
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '10587413395'
          run-id: '35453257161'
          github-token: ${{ github.token }}
          path: captured-parent
          merge-multiple: true
      - name: New parent UI, unchanged existing data, explicit source facts
        run: |
          pnpm --filter @hk-school/web exec vite build --config vite.production.config.ts
          python scripts/kg-parent-restore.py
          pnpm exec tsx scripts/kg-parent-inputs.ts
          python -m scripts.kg_parent.build prepare
      - uses: actions/cache@v4
        with:
          path: artifacts/kg-parent-cache
          key: kg-parent-evidence-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: kg-parent-evidence-v1-${{ runner.os }}-
      - name: Bounded Jev evidence selection for kindergarten only
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_PROVIDER: typesafe
        run: python -m scripts.kg_parent.build inference
      - name: Reconcile facts, preserve all source IDs and publishable evidence
        run: |
          python -m scripts.kg_parent.build finalize
          node scripts/production-metadata.mjs
          python scripts/full-catalog-verify.py
          python scripts/kg-parent-verify.py
          node scripts/production-deploy.mjs --config-only
      - name: Actual local workerd and parent browser journeys
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @hk-school/web exec playwright install --with-deps chromium
          pnpm exec wrangler dev --config artifacts/production/wrangler.production.json --local --port 8795 > artifacts/kg-parent/local-worker.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS --max-time 2 http://127.0.0.1:8795/api/v1/health > artifacts/kg-parent/local-health.json; then break; fi
            sleep 1
          done
          pnpm --filter @hk-school/web exec playwright test --config playwright.production.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kg-parent-production-${{ github.run_attempt }}
          path: |
            apps/web/dist-production
            apps/web/test-results-production
            artifacts/production
            artifacts/official-eight
            artifacts/kg-parent
          retention-days: 90
  publish:
    needs: prepare
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: {name: 'kg-parent-production-${{ github.run_attempt }}', path: .}
      - name: Durable original and kindergarten evidence archives
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/production-archive.mjs
          node scripts/archive-official-eight.mjs
          node scripts/kg-parent-archive.mjs
      - name: Update production only after immutable base and parent evidence gates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          SCHOOL_PRODUCTION_DEPLOY: schools.finpulsx.win
        run: node scripts/kg-parent-deploy.mjs
      - name: Independent live acceptance without inference or deployment credentials
        env:
          SCHOOL_PRODUCTION_BASE_URL: https://schools.finpulsx.win
          SCHOOL_PRODUCTION_EXPECTED_SHA: ${{ github.sha }}
        run: |
          pnpm --filter @hk-school/web exec playwright install --with-deps chromium
          pnpm --filter @hk-school/web exec playwright test --config playwright.production.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kg-parent-live-${{ github.run_attempt }}
          path: |
            artifacts/kg-parent/deployment-result.json
            artifacts/kg-parent/backup-result.json
            artifacts/kg-parent/verification.json
            artifacts/kg-parent/inference.json
            artifacts/production/deployment-result.json
            apps/web/test-results-production
          retention-days: 90
