name: Education category metadata inventory
on:
  push:
    branches: [research/education-source-inventory-20260919]
    paths: [.github/workflows/education-source-inventory.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Identify official catalogue transport and preserve public responses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inventory/raw
          python - <<'PY'
          import urllib.request,urllib.parse,json,pathlib,hashlib,datetime,re,concurrent.futures
          root=pathlib.Path('inventory');logs=[]
          def capture(url,name):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; HK-APP-Source-Inventory/1.0)'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      raw=r.read(30_000_001)
                      if len(raw)>30_000_000:raise ValueError('Response size bound')
                      status=r.status;ctype=r.headers.get('Content-Type');final=r.url
                  (root/'raw'/name).write_bytes(raw)
                  item={'url':url,'final_url':final,'file':name,'status':status,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
                  logs.append(item)
                  text=raw.decode('utf-8',errors='replace')
                  try:
                      j=json.loads(text);result=j.get('result',j)
                      print(name, 'KEYS',list(result)[:25] if isinstance(result,dict) else type(result).__name__,'COUNT',result.get('count',result.get('package_count')) if isinstance(result,dict) else len(result),flush=True)
                      if isinstance(result,dict) and result.get('results'):
                          for p in result['results']:print('DATASET',p.get('name'),p.get('title'),flush=True)
                  except (ValueError,TypeError):print(name,status,len(raw),text[:160],flush=True)
                  return text
              except Exception as e:
                  logs.append({'url':url,'file':name,'error':str(e)});print('FAILED',name,str(e),flush=True);return ''
          probes=[
              ('https://data.gov.hk/tc-data/api/3/action/group_show?id=education&include_datasets=true','group-with-packages.json'),
              ('https://data.gov.hk/tc-data/api/3/action/group_package_show?id=education&limit=1000','group-packages.json'),
              ('https://data.gov.hk/tc-data/api/3/action/package_search?fq=groups:education&rows=1000&start=0','package-search-tc.json'),
              ('https://data.gov.hk/en-data/api/3/action/package_search?fq=groups:education&rows=1000&start=0','package-search-en.json'),
              ('https://data.gov.hk/tc-datasets?page=1&category=education','page.html'),
              ('https://data.gov.hk/tc-data/api/3/action/package_list','package-list.json')]
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:results=list(pool.map(lambda x:capture(*x),probes))
          page=results[4]
          scripts=[urllib.parse.urljoin('https://data.gov.hk',x) for x in re.findall(r'<script[^>]+src=[\"\']([^\"\']+)',page)]
          scripts=[u for u in scripts if urllib.parse.urlparse(u).hostname=='data.gov.hk']
          print('OFFICIAL_SCRIPTS',json.dumps(scripts),flush=True)
          for n,u in enumerate(scripts[:15]):
              text=capture(u,f'page-script-{n}.js')
              if any(k in u.lower() for k in ['app','main','dataset','common','bundle','search']):
                  matches=re.findall(r'.{0,80}(?:api/|package_search|elastic|dataset/search|searchData|search-data|apiUrl|api_url).{0,150}',text)
                  print('TRANSPORT_HINTS',u,json.dumps(matches[:40]),flush=True)
          (root/'capture-log.json').write_text(json.dumps(logs,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-education-category-inventory
          path: inventory
          retention-days: 90
