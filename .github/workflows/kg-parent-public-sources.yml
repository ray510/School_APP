name: Kindergarten parent public source capture
on:
  push:
    branches: [release/full-catalog]
    paths: [.github/workflows/kg-parent-public-sources.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Retrieve bounded public official source documents only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p capture
          python - <<'PY'
          import urllib.request,urllib.parse,pathlib,json,hashlib,datetime,subprocess,concurrent.futures
          from html.parser import HTMLParser
          class Page(HTMLParser):
            def __init__(self):super().__init__(convert_charrefs=True);self.parts=[];self.links=[];self.skip=0;self.href=None;self.label=[]
            def handle_starttag(self,t,a):
              if t in ('script','style'):self.skip+=1
              if t in ('p','div','br','li','tr','td','h1','h2','h3'):self.parts.append('\n')
              if t=='a':self.href=dict(a).get('href');self.label=[]
            def handle_endtag(self,t):
              if t in ('script','style'):self.skip=max(0,self.skip-1)
              if t=='a' and self.href:self.links.append((self.href,''.join(self.label)));self.href=None
            def handle_data(self,s):
              if not self.skip:self.parts.append(s)
              if self.href:self.label.append(s)
          seeds=[('edb-k1','https://www.edb.gov.hk/tc/edu-system/preprimary-kindergarten/kindergarten-k1-admission-arrangements/2728_admission_arrangements.html'),('waichow','https://www.sswckge.edu.hk/'),('rhenish','https://sskg.ppe.rhenish.org/'),('ymca','https://www.sscymca.edu.hk/'),('waichow-fees','https://applications.edb.gov.hk/schoolsearch/schoolfee/158208.pdf'),('rhenish-fees','https://applications.edb.gov.hk/schoolsearch/schoolfee/157406.pdf'),('ymca-fees','https://applications.edb.gov.hk/schoolsearch/schoolfee/575429.pdf')]
          root=pathlib.Path('capture');results=[]
          def fetch(task):
            key,url=task
            try:
              url=urllib.parse.quote(url,safe=':/?&=%')
              host=urllib.parse.urlparse(url).hostname
              if host not in ('www.edb.gov.hk','applications.edb.gov.hk','www.sswckge.edu.hk','sskg.ppe.rhenish.org','www.sscymca.edu.hk'):raise ValueError('Unapproved public host')
              req=urllib.request.Request(url,headers={'User-Agent':'HK-School-Guide-Public-Source-Review/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                if urllib.parse.urlparse(r.url).hostname!=host:raise ValueError('Cross-host redirect not followed as evidence')
                raw=r.read(6000001);ctype=r.headers.get('content-type','')
              if len(raw)>6000000:raise ValueError('Document size bound')
              ext='.pdf' if raw.startswith(b'%PDF') else '.html';path=root/(key+ext);path.write_bytes(raw)
              links=[]
              if ext=='.pdf':
                subprocess.run(['pdftotext','-layout',str(path),str(root/(key+'.txt'))],check=True)
                text=(root/(key+'.txt')).read_text()
              else:
                p=Page();p.feed(raw.decode('utf-8-sig',errors='strict'));text='\n'.join(x.strip() for x in ''.join(p.parts).splitlines() if x.strip());links=p.links;(root/(key+'.txt')).write_text(text,encoding='utf8')
              result={'id':key,'url':url,'sha256':hashlib.sha256(raw).hexdigest(),'captured_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status':'CAPTURED','path':path.name,'text_path':key+'.txt','links':links,'bytes':len(raw)}
              print(key,'CAPTURED',len(raw),flush=True);return result
            except Exception as e:print(key,type(e).__name__,str(e),flush=True);return {'id':key,'url':url,'status':'FAILED','reason':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:results=list(pool.map(fetch,seeds))
          follow=[];seen={x[1] for x in seeds}
          for r in results:
            if r['id'] not in ('waichow','rhenish','ymca'):continue
            n=0
            for href,label in r.get('links',[]):
              if not any(w in label for w in ('報名資料','入學申請','報名方法','收費','上課時間','上課時段','接送')):continue
              u=urllib.parse.urljoin(r['url'],href)
              if urllib.parse.urlparse(u).hostname!=urllib.parse.urlparse(r['url']).hostname or u in seen or u.lower().endswith(('.jpg','.png','.zip')):continue
              seen.add(u);n+=1;follow.append((r['id']+'-page-'+str(n),u))
              if n==5:break
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:results+=list(pool.map(fetch,follow))
          (root/'manifest.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf8')
          print(json.dumps({'documents':len(results),'captured':sum(r['status']=='CAPTURED' for r in results),'scope':'public source capture only, not publication verification'}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kg-parent-public-capture
          path: capture
          retention-days: 90
