name: Real data and finpulsx test deployment
on:
  push:
    branches: [fix/phase1-stabilization]
    paths: [.github/workflows/test-site-release.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hk-school-test-site
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test
      - name: Download official sources once and retain evidence
        run: |
          mkdir -p artifacts
          pnpm school source probe --all --out artifacts/source-probe.json > artifacts/source-probe.log
          python scripts/annual-source-inspection.py
      - name: Build staging website and full eligible source package
        env:
          SCHOOL_BUILD_ENV: staging
        run: |
          pnpm build:web
          pnpm exec tsx scripts/test-site-data.ts
      - name: Validate data in actual local D1 and browsers
        shell: bash
        run: |
          set -euo pipefail
          pnpm db:migrate:local
          node -e "const f=require('node:fs');const m=JSON.parse(f.readFileSync('artifacts/test-site/manifest.json'));f.writeFileSync('artifacts/test-site/combined.sql',m.chunks.map(c=>f.readFileSync('artifacts/test-site/'+c.file,'utf8')).join('\n'))"
          pnpm exec wrangler d1 execute DB --config wrangler.jsonc --env local --local --persist-to .wrangler/state --file artifacts/test-site/combined.sql > artifacts/test-site/local-import.log
          pnpm --filter @hk-school/web exec playwright install --with-deps chromium
          node scripts/local.mjs dev > artifacts/test-site/local-worker.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:8787/api/v1/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke-local.mjs --expect-published
          pnpm --filter @hk-school/web exec playwright test --config playwright.staging.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-test-site-package
          path: |
            apps/web/dist
            apps/web/test-results-staging
            artifacts/test-site
            archive
          retention-days: 30
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      SCHOOL_TEST_DEPLOY: schools-test.finpulsx.win
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: school-test-site-package
          path: .
      - name: Provision isolated data, deploy only the test hostname and verify HTTPS
        run: node scripts/deploy-test-site.mjs --execute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-test-deployment-result
          path: |
            artifacts/test-site/deployment-result.json
            artifacts/test-site/d1-import-result.json
            artifacts/test-site/wrangler.test.json
          retention-days: 30
