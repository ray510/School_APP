name: Eight official sources capture
on:
  push:
    branches: [release/full-catalog]
    paths: [.github/workflows/official-eight-capture.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Preserve exact source baseline
        run: |
          mkdir -p artifacts/official-discovery/raw
          git archive HEAD --format=tar.gz -o artifacts/official-discovery/source.tar.gz
          git rev-parse HEAD > artifacts/official-discovery/commit.txt
      - name: Download authorised public catalogues and their latest listed CSV or XML resources
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, json, pathlib, hashlib, datetime, time, re
          root=pathlib.Path('artifacts/official-discovery');reports=[];total=0
          hosts={'data.gov.hk','www.edb.gov.hk','edb.gov.hk','applications.edb.gov.hk'}
          def checked(url):
            u=urllib.parse.urlsplit(url)
            if u.scheme not in ('https','http') or u.hostname not in hosts or u.username or u.password or u.port not in (None,80,443):raise ValueError('Unapproved public source')
            return urllib.parse.urlunsplit(('https',u.hostname,u.path,u.query,''))
          class Redirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,req,fp,code,msg,headers,newurl):return super().redirect_request(req,fp,code,msg,headers,checked(newurl))
          def fetch(url,path,limit):
            global total
            url=checked(url)
            with urllib.request.build_opener(Redirect()).open(urllib.request.Request(url,headers={'User-Agent':'HK-School-Guide-Public-Data/1.0','Accept-Encoding':'identity'}),timeout=45) as response:
              raw=response.read(limit+1);final=checked(response.url);status=response.status
            total+=len(raw)
            if len(raw)>limit or total>250000000:raise ValueError('Capture size limit')
            path.write_bytes(raw)
            return raw,{'url':url,'final_url':final,'file':str(path.relative_to(root)),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'fetched_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'http_status':status}
          datasets={'A02':'hk-edb-schinfo-registration-info','A06':'hk-edb-kgjoinkes-kg-join-kes','A07':'hk-edb-freekg-not-joining-scheme-list','A08':'hk-edb-freekg-k1-k3-vacancy-information','A09':'hk-edb-dss-dds-school-list','A10':'hk-edb-tts2-through-train-school-list','A11':'hk-edb-itmospoa-poa-schoolnet-list','A12':'hk-edb-sspa-sspa-schservingnet'}
          errors=[]
          for code,slug in datasets.items():
            raw,meta=fetch('https://data.gov.hk/tc-data/api/3/action/package_show?id='+slug,root/(code+'.json'),5000000)
            obj=json.loads(raw)
            if obj.get('success') is not True or obj['result']['name']!=slug:raise ValueError('Catalogue identity mismatch')
            candidates={}
            for r in obj['result']['resources']:
              title=r.get('name','');fmt=r.get('format','').upper();role=None
              if code=='A02' and fmt=='XML':role='registration' if '基本註冊' in title else 'premises' if '校舍資料' in title else 'capacity' if '容額' in title else None
              elif fmt=='CSV' and '繁體' in title and '簡體' not in title:role=('dss_fees' if '學費' in title else 'dss') if code=='A09' else 'data'
              if role:candidates.setdefault(role,[]).append(r)
            if not candidates:raise ValueError('No selected resources for '+code)
            entry={'code':code,'dataset':slug,'metadata':meta,'resources':[]}
            for role,items in candidates.items():
              def year(r):
                m=re.search(r'(20\d{2})\s*[/／-]',r.get('name',''));return int(m[1]) if m else 0
              newest=max(year(r) for r in items)
              for r in items:
                if year(r)!=newest:continue
                item={'code':code,'role':role,'resource_id':r['id'],'name':r['name'],'format':r['format']}
                try:
                  payload,ev=fetch(r['url'],root/'raw'/(r['id']+'.'+r['format'].lower()),50000000)
                  item.update(state='FETCHED_NOT_VALIDATED',evidence=ev)
                  print(code,role,len(payload),payload[:250].decode('utf8',errors='replace'),flush=True)
                except Exception as e:item.update(state='BLOCKED',error=str(e));errors.append(item)
                entry['resources'].append(item)
            reports.append(entry);(root/'capture.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2),encoding='utf8')
          print('RAW_RESOURCES',sum(len(x['resources']) for x in reports),'ERRORS',len(errors))
          if errors:raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-eight-discovery
          path: artifacts/official-discovery
          retention-days: 30
