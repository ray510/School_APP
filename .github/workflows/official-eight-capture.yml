name: Eight official sources capture
on:
  push:
    branches: [release/full-catalog]
    paths: [.github/workflows/official-eight-capture.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Preserve exact source baseline
        run: |
          mkdir -p artifacts/official-discovery
          git archive HEAD --format=tar.gz -o artifacts/official-discovery/source.tar.gz
          git rev-parse HEAD > artifacts/official-discovery/commit.txt
      - name: Read eight public dataset catalogues without credentials
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, json, pathlib, hashlib, datetime, time
          root=pathlib.Path('artifacts/official-discovery'); reports=[]
          datasets={'A02':'hk-edb-schinfo-registration-info','A06':'hk-edb-kgjoinkes-kg-join-kes','A07':'hk-edb-freekg-not-joining-scheme-list','A08':'hk-edb-freekg-k1-k3-vacancy-information','A09':'hk-edb-dss-dds-school-list','A10':'hk-edb-tts2-through-train-school-list','A11':'hk-edb-itmospoa-poa-schoolnet-list','A12':'hk-edb-sspa-sspa-schservingnet'}
          for code,slug in datasets.items():
            url='https://data.gov.hk/tc-data/api/3/action/package_show?id='+slug
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'HK-School-Guide-Public-Data/1.0'}),timeout=35) as response:
              raw=response.read(5000001)
            if len(raw)>5000000:raise ValueError('Catalogue size limit')
            obj=json.loads(raw)
            if obj.get('success') is not True or obj['result']['name']!=slug:raise ValueError('Catalogue identity mismatch')
            (root/(code+'.json')).write_bytes(raw)
            record={'code':code,'url':url,'sha256':hashlib.sha256(raw).hexdigest(),'fetched_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'resources':len(obj['result']['resources'])}
            reports.append(record); print(json.dumps(record));time.sleep(.2)
          (root/'capture.json').write_text(json.dumps(reports,ensure_ascii=False,indent=2),encoding='utf8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-eight-discovery
          path: artifacts/official-discovery
          retention-days: 30
